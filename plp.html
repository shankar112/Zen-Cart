<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Shop — ZenCart</title>
  <link rel="stylesheet" href="assets/css/base.css"/>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <header class="header">
    <div class="container nav">
      <a class="brand" href="index.html"><span class="logo"></span> ZenCart</a>
      <nav class="row">
        <a class="link" href="index.html">Home</a>
        <a class="cart-pill" href="cart.html">Cart <span id="cart-count" class="pill-badge">0</span></a>
      </nav>
    </div>
  </header>

  <main id="main" class="container" tabindex="-1">
    <div class="breadcrumb mt-2"><a href="index.html">Home</a> › <span>Shop</span></div>
    <section>
      <div class="row between">
        <h1 class="mb-0">Products</h1>
        <div class="search w-100" style="max-width:420px">
          <input id="search" placeholder="Search products, categories..."/>
          <button class="btn ghost" id="clear">Clear</button>
        </div>
      </div>
      <div class="spacer"></div>
      <div id="plp" class="grid cols-4"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container row between">
      <span class="muted">Free shipping over $50</span>
      <a class="link" href="checkout.html">Checkout</a>
    </div>
  </footer>

  <script src="assets/js/bundle.js" defer></script>
</body>
</html>
